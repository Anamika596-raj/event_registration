<!DOCTYPE html>
<html>
<head>
    <title>Event Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            padding: 50px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>{{ event.name }}</h1>

        <p>
            <strong>Description:</strong><br>
            {{ event.description }}
        </p>

        <p>
            <strong>📅 Date:</strong>
            {{ event.date }}
        </p>

        <p>
            <strong>📍 Location:</strong>
            {{ event.location }}
        </p>

        <a class="button" href="{% url 'event_list' %}">
            ← Back to Events
        </a>

    </div>

</body>
</html>
