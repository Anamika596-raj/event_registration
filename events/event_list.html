<!DOCTYPE html>
<html>
<head>
    <title>Event Registration System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .events {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .card {
            background: white;
            width: 300px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #555;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <h1>🎉 Upcoming Events</h1>

    <div class="events">

        {% for event in events %}

        <div class="card">

            <h2>{{ event.name }}</h2>

            <p>{{ event.description }}</p>

            <p><strong>📅 Date:</strong> {{ event.date }}</p>

            <p><strong>📍 Location:</strong> {{ event.location }}</p>

            <a class="button" href="{% url 'event_detail' event.id %}">
                View Details
            </a>

        </div>

        {% empty %}

        <p>No events available.</p>

        {% endfor %}

    </div>

</body>
</html>
